name: Run Laravel Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP and necessary extensions
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Change this if your app uses PHP 8.2, etc.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer:v2

      # 3. Copy .env.example to .env
      - name: Prepare Environment File
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      # 4. Install Composer dependencies
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --ansi

      # 5. Generate Laravel Application Key
      - name: Generate Key
        run: php artisan key:generate

      # 6. Run PHPUnit (it will automatically use your phpunit.xml configuration)
      - name: Execute Tests
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
